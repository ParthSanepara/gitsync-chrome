name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm zip
      - run: scripts/check-prod-bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-zip
          path: .output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true # .output is a dot-directory
          retention-days: 14
