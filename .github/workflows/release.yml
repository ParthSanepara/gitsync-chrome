name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # Not GITHUB_TOKEN: PRs opened with it do not trigger CI, so the release
          # PR could never satisfy branch protection. See docs/RELEASING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm zip
      - run: scripts/check-prod-bundle.sh
      - name: Attach zip to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" .output/*-chrome.zip --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: chrome-zip
          path: .output/*-chrome.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Holds the store secrets. Add required reviewers on this environment to
    # gate every store submission behind a manual approval.
    environment: chrome-web-store
    env:
      CHROME_API_VERSION: v2
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
    steps:
      - name: Skip until store secrets exist
        if: env.CHROME_EXTENSION_ID == ''
        run: echo "::notice::Chrome Web Store secrets not configured; skipping submission. Upload the release zip manually (docs/RELEASING.md)."
      - uses: actions/checkout@v7
        if: env.CHROME_EXTENSION_ID != ''
      - uses: ./.github/actions/setup
        if: env.CHROME_EXTENSION_ID != ''
      - uses: actions/download-artifact@v8
        if: env.CHROME_EXTENSION_ID != ''
        with:
          name: chrome-zip
          path: dist
      - name: Upload and submit for review
        if: env.CHROME_EXTENSION_ID != ''
        run: pnpm wxt submit --chrome-zip dist/*-chrome.zip
